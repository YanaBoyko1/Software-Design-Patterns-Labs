<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Patient | Dental Clinic</title>
    <style>
        :root {
            --primary: #2563eb;    /* Dental Blue */
            --secondary: #0f172a;  /* Dark Slate */
            --success: #10b981;    /* Emerald */
            --danger: #ef4444;     /* Rose */
            --bg: #f8fafc;
        }

        body { 
            font-family: 'Inter', 'Segoe UI', sans-serif; 
            background: var(--bg); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }

        .card { 
            background: white; 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); 
            width: 420px; 
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Alerts */
        .alert {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
            color: white;
            transition: opacity 0.5s ease;
        }
        .alert-danger { background-color: var(--danger); }
        .alert-success { background-color: var(--success); }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { margin: 0; font-size: 1.6rem; color: var(--secondary); letter-spacing: -0.5px; }
        .header span { color: var(--primary); font-size: 1.8rem; vertical-align: middle; margin-right: 8px; }
        
        label { 
            display: block; 
            margin-bottom: 8px; 
            color: #64748b; 
            font-size: 0.85rem; 
            font-weight: 600; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }

        input, select { 
            width: 100%; 
            padding: 14px; 
            margin-bottom: 20px; 
            border: 2px solid #f1f5f9; 
            border-radius: 12px; 
            box-sizing: border-box; 
            font-size: 1rem; 
            background: #f8fafc;
            transition: 0.3s;
            color: var(--secondary);
        }
        input:focus, select:focus { border-color: var(--primary); outline: none; background: white; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }
        
        button { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 16px; 
            width: 100%; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 1.1rem; 
            font-weight: bold; 
            transition: 0.3s; 
            box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2);
            margin-top: 10px;
        }
        button:hover { background: #1d4ed8; transform: translateY(-1px); box-shadow: 0 6px 12px rgba(37, 99, 235, 0.3); }
        
        .back { display: block; text-align: center; margin-top: 25px; color: #94a3b8; text-decoration: none; font-size: 0.9rem; font-weight: 500; }
        .back:hover { color: var(--secondary); }
    </style>
</head>
<body>
    <div class="card">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} flash-message">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <div class="header">
            <h1><span>🦷</span>Add New Patient</h1>
        </div>
        
        <form method="POST">
            <label>Full Name *</label>
            <input type="text" name="name" placeholder="Enter patient's full name" required>

            <label>Email Address *</label>
            <input type="email" name="email" placeholder="example@mail.com" required>

            <label>Assign Dentist *</label>
            <select name="dentist_id" required>
                <option value="" disabled selected>Select a dentist from the list</option>
                {% for d in dentists %}
                <option value="{{ d.id }}">Dr. {{ d.name }} ({{ d.specialization }})</option>
                {% endfor %}
            </select>

            <label>Medical Card Number</label>
            <input type="number" name="card_id" placeholder="Auto-generated if left blank">

            <button type="submit">Register Patient</button>
        </form>
        <a href="/" class="back">← Back to Registry</a>
    </div>

    <script>
        // Automatically hide flash messages after 3 seconds
        setTimeout(() => {
            document.querySelectorAll('.flash-message').forEach(el => {
                el.style.opacity = '0';
                setTimeout(() => el.remove(), 500);
            });
        }, 3000);
    </script>
</body>
</html>
